# CI: 跨平台构建与测试 H3 Nim 绑定
# 改编自 nim-c-bindings 参考工作流

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ github.token }}

      - name: Build (Release)
        run: nim c -d:release -o:bin/h3nim src/h3nim.nim

      - name: Run Tests
        run: nim c -r tests/test_h3nim.nim

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ github.token }}

      - name: Build (Release)
        run: nim c -d:release -o:bin/h3nim src/h3nim.nim

      - name: Run Tests
        run: nim c -r tests/test_h3nim.nim

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ github.token }}

      - name: Build (Release)
        shell: pwsh
        run: nim c -d:release -o:bin/h3nim.exe src/h3nim.nim

      - name: Run Tests
        shell: pwsh
        run: nim c -r tests/test_h3nim.nim
